}

  margin: 0;
  padding: 8px 12px;
}

}

  display: grid;
  gap: 8px;
}

  border-radius: 8px;
  background: var(--oe-surface-sunken);
  padding: 8px 10px;
}
.memory-panel button {
  min-height: 36px;
  cursor: pointer;
  background: transparent;
}

}

}

}

  display: grid;
  gap: 8px;
}
.memory-actions > .memory-hint {

}

}

  display: grid;
  gap: 8px;
}
.memory-entry {

  border-radius: 8px;
  padding: 12px;
  display: grid;
  gap: 8px;
}
.memory-content {
  white-space: pre-wrap;

.memory-panel .memory-danger, .memory-alert {
  color: var(--oe-danger);

.memory-notice {
  overflow-wrap: anywhere;
}
.memory-status {
  color: var(--oe-ink-muted);
}
.memory-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

}

  display: grid;
  gap: 8px;

.memory-pane-list {

  grid-template-columns: minmax(0, 1fr);

  font-weight: 600;

.memory-entry-active {
  border-color: var(--oe-accent);
}
.memory-title {
  margin: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.memory-proposals {
  display: grid;
  gap: 8px;
}
.memory-proposal {
  border-left: 3px solid var(--oe-accent);

@media (max-width: 720px) {

    grid-template-columns: minmax(0, 1fr);

    position: static;
